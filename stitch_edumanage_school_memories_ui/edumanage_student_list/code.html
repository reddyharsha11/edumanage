<!-- Content Canvas (Shell Suppressed due to task-focused 'back' navigation intent) -->
<main class="max-w-5xl mx-auto p-container-padding">
<!-- Header Section -->

<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-tertiary transition-colors">search</span>

<div class="col-span-3 hidden md:block">Attendance</div>
<div class="col-span-4 md:col-span-3">Overall Marks</div>
<div class="col-span-2 md:col-span-1 text-right">Action</div>
</div>

<span class="inline-flex items-center gap-1 bg-primary-fixed text-on-primary-fixed font-label-caps text-label-caps px-3 py-1 rounded-sm border-x-2 border-dashed border-primary">
<span class="material-symbols-outlined text-[14px]">check_circle</span>
                            98%
                        </span>
</div>
<div class="col-span-4 md:col-span-3 flex items-center">
<span class="inline-block bg-secondary-fixed text-on-secondary-fixed font-label-caps text-label-caps px-3 py-1 rounded-sm border-x-2 border-dashed border-secondary">
                            A- (92)
                        </span>
</div>
<div class="col-span-2 md:col-span-1 flex justify-end items-center text-outline group-hover:text-tertiary transition-colors">
<span class="material-symbols-outlined">chevron_right</span>
</div>
</div>
